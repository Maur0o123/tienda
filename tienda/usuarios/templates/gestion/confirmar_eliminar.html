{% extends 'base.html' %}

{% block title %}Eliminar usuario | Administración{% endblock %}

{% block content %}
<section class="auth">
    <div class="auth-card center">
        <h1>¿Eliminar <span class="gradient">usuario</span>?</h1>
        <p class="auth-sub">Vas a eliminar la cuenta de «{{ object.username }}». Esta acción no se puede deshacer.</p>

        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger btn-lg btn-block">Sí, eliminar</button>
        </form>

        <p class="auth-alt"><a href="{% url 'panel_usuarios' %}">Cancelar</a></p>
    </div>
</section>
{% endblock %}
